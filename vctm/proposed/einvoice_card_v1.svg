<svg xmlns="http://www.w3.org/2000/svg" width="365" height="243" viewBox="0 0 365 243" fill="none">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="243" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F7F9FC"/>
  </linearGradient>
  <clipPath id="card"><rect x="0.5" y="0.5" width="364" height="242" rx="14.5"/></clipPath>
</defs>
<rect x="0.5" y="0.5" width="364" height="242" rx="14.5" fill="url(#bg)" stroke="#BDBDBD"/>
<g clip-path="url(#card)"><rect x="0" y="0" width="6" height="243" fill="#7C2D12"/></g>
<g transform="translate(316 20)" fill="none" stroke="#7C2D12" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M4 2h11l5 5v15H4z"/><path d="M15 2v5h5"/><path d="M7.5 12h9M7.5 16h9M7.5 8h4"/></g>
<text x="26" y="32" font-family="Arial" font-size="9" fill="#7C2D12" letter-spacing="0.8" xml:space="preserve">EINVOICE</text>
<text x="26" y="66" font-family="Arial" font-size="14" fill="#0C0E11" font-weight="bold" xml:space="preserve">{{seller_name}}</text>
<text x="26" y="85" font-family="Arial" font-size="11" fill="#4A5568" xml:space="preserve">Invoice {{invoiceNumber}}</text>
<text x="26" y="116" font-family="Arial" font-size="19" fill="#7C2D12" font-weight="bold" xml:space="preserve">{{amountDueForPayment}} {{InvoiceCurrencyCode}}</text>
<line x1="26" y1="140" x2="339" y2="140" stroke="#E2E8F0"/>
<text x="26" y="164" font-family="Arial" font-size="9" fill="#718096" letter-spacing="0.8" xml:space="preserve">ISSUED</text>
<text x="26" y="178" font-family="Arial" font-size="11" fill="#1A202C" xml:space="preserve">{{issueDate}}</text>
<text x="190" y="164" font-family="Arial" font-size="9" fill="#718096" letter-spacing="0.8" xml:space="preserve">VAT TOTAL</text>
<text x="190" y="178" font-family="Arial" font-size="11" fill="#1A202C" xml:space="preserve">{{invoiceTotalVatAmount}}</text>
<rect x="12" y="194" width="342" height="38" rx="8" fill="#F8EFEA"/>
<text x="26" y="211" font-family="Arial" font-size="9" fill="#718096" letter-spacing="0.8" xml:space="preserve">STATUS</text>
<text x="26" y="225" font-family="Arial" font-size="11" fill="#1A202C" xml:space="preserve">{{invoiceLifecycleStatus}}</text>
<text x="190" y="211" font-family="Arial" font-size="9" fill="#718096" letter-spacing="0.8" xml:space="preserve">BUYER</text>
<text x="190" y="225" font-family="Arial" font-size="11" fill="#1A202C" xml:space="preserve">{{buyer_name}}</text>
</svg>
